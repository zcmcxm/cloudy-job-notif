[project]
name = "job-alert"
version = "0.1.0"
description = "Serverless job alert: watch company careers pages, email a digest of new roles."
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "respx>=0.21"]
aws = ["boto3>=1.34", "aws-lambda-powertools>=2.40"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/job_alert"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
